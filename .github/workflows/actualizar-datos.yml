name: Actualizar datos de Meta

on:
  schedule:
    - cron: "17 11 * * *"   # todos los días a las 6:17 a. m. de Lima
  workflow_dispatch:
    inputs:
      months:
        description: "Cuántos meses actualizar, contando el actual (usa 6 la primera vez)"
        required: false
        default: "2"

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Traer datos de Meta
        run: node scripts/fetch-meta.mjs
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          MONTHS: ${{ github.event.inputs.months || '2' }}

      - name: Guardar cambios
        run: |
          git config user.name "PanelSpotlight"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Datos de Meta $(TZ=America/Lima date +'%Y-%m-%d')"
            git push
          fi
